<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
	width="480" height="360" viewBox="0 0 480 360">
	<title>Gradients</title>
	<desc>The gradients of the SVG reader: linear and radial, pad, reflect and
		repeat, stops with opacity, a gradient's matrix, the user's space and
		the bounding box, fills and strokes, and a gradient from another by href</desc>
	<defs>
		<!-- the sky, of the user's space, the whole picture -->
		<linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="360">
			<stop offset="0" stop-color="#0b1a3a"/>
			<stop offset="0.55" stop-color="#5a2a6e"/>
			<stop offset="0.85" stop-color="#d9644a"/>
			<stop offset="1" stop-color="#f6b35c"/>
		</linearGradient>
		<!-- a sun, a glow that fades out by its stops' opacity -->
		<radialGradient id="sun">
			<stop offset="0" stop-color="#fffef0"/>
			<stop offset="0.3" stop-color="#ffe27a"/>
			<stop offset="0.55" stop-color="#ff9a3c" stop-opacity="0.8"/>
			<stop offset="1" stop-color="#ff6a2c" stop-opacity="0"/>
		</radialGradient>
		<!-- a short band, and the three spreads of it, by href -->
		<linearGradient id="band" x1="0.4" y1="0" x2="0.6" y2="0">
			<stop offset="0" stop-color="#ff3d6e"/>
			<stop offset="0.5" stop-color="#ffd23f"/>
			<stop offset="1" stop-color="#3ec1ff"/>
		</linearGradient>
		<linearGradient id="band_pad" xlink:href="#band" spreadMethod="pad"/>
		<linearGradient id="band_reflect" xlink:href="#band" spreadMethod="reflect"/>
		<linearGradient id="band_repeat" xlink:href="#band" spreadMethod="repeat"/>
		<!-- rings, and the three spreads of them -->
		<radialGradient id="ring" r="0.2">
			<stop offset="0" stop-color="#2af5c4"/>
			<stop offset="0.6" stop-color="#2058ff"/>
			<stop offset="1" stop-color="#1a1240"/>
		</radialGradient>
		<radialGradient id="ring_pad" xlink:href="#ring" spreadMethod="pad"/>
		<radialGradient id="ring_reflect" xlink:href="#ring" spreadMethod="reflect"/>
		<radialGradient id="ring_repeat" xlink:href="#ring" spreadMethod="repeat"/>
		<!-- balls, a light off centre and a shadow, over a color of their own -->
		<radialGradient id="ball_red" cx="0.38" cy="0.35" r="0.7">
			<stop offset="0" stop-color="#ffb0a0"/>
			<stop offset="0.45" stop-color="#e0301e"/>
			<stop offset="1" stop-color="#3a0500"/>
		</radialGradient>
		<radialGradient id="ball_green" xlink:href="#ball_red">
			<stop offset="0" stop-color="#d8ffb0"/>
			<stop offset="0.45" stop-color="#3cb82a"/>
			<stop offset="1" stop-color="#062a00"/>
		</radialGradient>
		<radialGradient id="ball_blue" xlink:href="#ball_red">
			<stop offset="0" stop-color="#c8e4ff"/>
			<stop offset="0.45" stop-color="#2a6ee0"/>
			<stop offset="1" stop-color="#00103a"/>
		</radialGradient>
		<radialGradient id="shadow">
			<stop offset="0" stop-color="#000000" stop-opacity="0.5"/>
			<stop offset="1" stop-color="#000000" stop-opacity="0"/>
		</radialGradient>
		<!-- a rainbow for a stroke -->
		<linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="1">
			<stop offset="0" stop-color="#ff0040"/>
			<stop offset="0.2" stop-color="#ff9000"/>
			<stop offset="0.4" stop-color="#ffee00"/>
			<stop offset="0.6" stop-color="#20e040"/>
			<stop offset="0.8" stop-color="#2090ff"/>
			<stop offset="1" stop-color="#a040ff"/>
		</linearGradient>
		<!-- stripes, turned by the gradient's matrix -->
		<linearGradient id="stripes" x1="0" y1="0" x2="0.125" y2="0" spreadMethod="repeat"
			gradientTransform="rotate(35 0.5 0.5)">
			<stop offset="0" stop-color="#ffffff"/>
			<stop offset="0.5" stop-color="#ffffff"/>
			<stop offset="0.5" stop-color="#e83a5a"/>
			<stop offset="1" stop-color="#e83a5a"/>
		</linearGradient>
		<!-- glass, a sheen of white that fades -->
		<linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
			<stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
			<stop offset="0.5" stop-color="#ffffff" stop-opacity="0.1"/>
			<stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
		</linearGradient>
	</defs>

	<rect width="480" height="360" fill="url(#sky)"/>
	<circle cx="400" cy="72" r="64" fill="url(#sun)"/>

	<!-- pad, reflect, repeat of a band -->
	<g stroke="#ffffff" stroke-opacity="0.6" stroke-width="2">
		<rect x="20" y="20" width="100" height="80" rx="10" fill="url(#band_pad)"/>
		<rect x="135" y="20" width="100" height="80" rx="10" fill="url(#band_reflect)"/>
		<rect x="250" y="20" width="100" height="80" rx="10" fill="url(#band_repeat)"/>
	</g>

	<!-- pad, reflect, repeat of rings -->
	<circle cx="70" cy="160" r="42" fill="url(#ring_pad)"/>
	<circle cx="185" cy="160" r="42" fill="url(#ring_reflect)"/>
	<circle cx="300" cy="160" r="42" fill="url(#ring_repeat)"/>

	<!-- balls on their shadows -->
	<ellipse cx="78" cy="320" rx="44" ry="10" fill="url(#shadow)"/>
	<ellipse cx="193" cy="320" rx="44" ry="10" fill="url(#shadow)"/>
	<ellipse cx="308" cy="320" rx="44" ry="10" fill="url(#shadow)"/>
	<circle cx="70" cy="270" r="44" fill="url(#ball_red)"/>
	<circle cx="185" cy="270" r="44" fill="url(#ball_green)"/>
	<circle cx="300" cy="270" r="44" fill="url(#ball_blue)"/>

	<!-- a stroke of a gradient, and a fill of one under a turned matrix -->
	<circle cx="415" cy="190" r="40" fill="none" stroke="url(#rainbow)" stroke-width="14"/>
	<g transform="translate(415 290)">
		<path d="M 0 -48 L 13 -16 L 46 -15 L 21 6 L 29 39 L 0 20 L -29 39 L -21 6 L -46 -15 L -13 -16 Z"
			fill="url(#stripes)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/>
	</g>

	<!-- glass over the bands -->
	<g fill="url(#glass)">
		<rect x="20" y="20" width="100" height="40" rx="10"/>
		<rect x="135" y="20" width="100" height="40" rx="10"/>
		<rect x="250" y="20" width="100" height="40" rx="10"/>
	</g>
</svg>
